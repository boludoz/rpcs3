# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Caps Gradle task/worker parallelism (and, for AGP, the native ninja/cmake
# job count for the static-LLVM + rpcs3 core build) at 2 concurrent workers
# instead of the default (one per core) - this build is otherwise heavy
# enough to saturate every core on the machine.
org.gradle.workers.max=2
# Reuses the cached task graph across builds instead of re-running the
# configuration phase every time (AGP 8.13 + Gradle 9.5 both have mature
# support for it). "warn" (not "fail") so an incompatible plugin/task just
# skips the cache for that invocation instead of breaking the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.native.buildStagingDirectory=.cxx

# Passed through to android/CMakeLists.txt so a clean Windows machine
# doesn't need Visual Studio or a manually configured CMake toolchain -
# only Android Studio's SDK/NDK components (or `sdkmanager --install
# "ndk;29.0.13113456" "cmake;3.31.6"`).
rpcs3.ndkVersion=29.0.13113456
rpcs3.cmakeVersion=3.31.6
